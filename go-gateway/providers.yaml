  - name: raccoon
    type: channel
    channel: raccoon
    #
    # Raccoon（商汤 / Senser「小浣熊」）桌面客户端。推理端点是普通 OpenAI Chat Completions
    # （POST {apiBase}/api/web/llm/v2/chat/completions），因此复用 OpenAIProvider；
    # 渠道侧多做的三件事：
    #   1. 鉴权 Authorization: Bearer <token>（由 AuthSource 提供，401 自动续期一次）；
    #   2. 复刻固定头 Accept: text/event-stream / X-Raccoon-Language: zh /
    #      X-Client-Platform: desktop-windows；其中 X-Org-Code 必须是**当前账号**的
    #      office_identity（个人账号为空），故走 DynamicHeaders 每请求求值；
    #   3. 思考档位只认 extra_body.thinking.type（顶层 reasoning_effort / thinking 会被
    #      静默忽略），由 Transform 折叠进 extra_body。
    #
    # 登录有两条路径，都在本机回环页上完成（网关在 127.0.0.1 随机端口起小服务）：
    #   - 微信扫码：二维码内容 = {apiBase}/login/mp?code=<随机 hex>，服务端不提供图片，
    #     故由网关**本地渲染**成 SVG（见 internal/channel/raccoon_qr.go），页面每 2 秒
    #     轮询一次 /raccoon/poll；
    #   - 短信：手机号经 AES-128-CFB 加密（密钥为客户端内置常量，可用
    #     RACCOON_PHONE_CIPHER_SECRET 覆盖）后调 send_sms / login_with_sms，
    #     下发前需过阿里云滑块验证码。
    # 登录不需要任何第三方应用密钥，开箱可用。
    #
    # ⚠️ 同其它账号渠道：这是复刻官方客户端的非官方用法，可能违反服务条款并导致账号被封。
