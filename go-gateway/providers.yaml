      - id: workbuddy/deepseek-v4.1-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 128000
      - id: workbuddy/deepseek-v4.1-flash-sg
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
