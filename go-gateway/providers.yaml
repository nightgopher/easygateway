# 模型提供商配置
# 命名规则：
#   - provider 实例名与对外模型名都用上游模型 ID，不设置别名
#   - 不同供应商提供同名模型时，后注册的那个用 供应商-模型 限定，保证实例名唯一
#   - 客户端只调用 chains 里定义的链，链内按顺序持续降级

# 留空保留所有网页来源均可跨域访问；配置后仅放行这些 HTTP(S) origin。
cors:
  allowed_origins: []

providers:
  # 智谱 GLM
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    # GLM-5.3 reasoning 请求可能超过常规 120 秒上游期限，显式放宽，
    # 避免长请求仍在处理时被本地超时中断并计入熔断。
    request_timeout_seconds: 900
    # 始终思考模型：大上下文 + 工具结果时首 token 前的思考可能超过全局思考档
    # 默认，per-provider 覆盖思考档首字期限（fallback 预算随之抬升）。
    reasoning_first_output_timeout_seconds: 180
    models:
      - id: glm-5.3
        # 始终思考模型：上游不接受 thinking:disabled（网关侧自动丢弃该参数）
        capabilities: [text, tool_calling, streaming, reasoning]
        # 单价（USD / 百万 token），供 GET /admin/usage 折算成本。取消注释并
        # 按官网刊例价填写后生效；缓存读写单价未披露则省略（缓存读按输入价计）。
        # pricing:
        #   input_per_m: 3
        #   output_per_m: 12
      # flash 同样支持图片输入（实测 coding/paas 两个端点都收 image_url），
      # 因此图片能力落在这一档，不再单开一个更弱的 glm-5v-turbo 供应商。
      - id: glm-5.3-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]

  # ChatGPT Plus/Pro Codex subscription. The provider reads OAuth credentials
  # from Codex CLI/Pi auth.json; HTTP_PROXY is optional and only controls
  # network access.
  - name: chatgpt
    type: chatgpt
    url: https://chatgpt.com/backend-api
    models:
      # GPT-6 家族（账号当前主线）。gpt-6-terra 不存在、gpt-6-pro 与各 -wm
      # 变体在 Codex 订阅端点会被拒（HTTP 400 "not supported"），故不登记。
      - id: gpt-6.1-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-astra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      # GPT-5.6 家族：上游仍在服务，且部分客户端配置仍引用这些名字。
      - id: gpt-5.6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-terra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000

  # Antigravity（Google 账号 OAuth，由本机 8317 端口的 CLIProxyAPI 反代）。
  # 凭据/token 续期都在 CLIProxyAPI 侧维护，网关只当普通 OpenAI 兼容上游用；
  # CLIPROXY_API_KEY 是 CLIProxyAPI config.yaml 里的静态 api-key。
  # gemini-3.8-flash 是当前 Gemini 系列主力（-high 为思考档后缀，属上游真名），
  # 实测接受 image_url（vision 落在这一档）。
  - name: antigravity
    type: openai
    url: http://127.0.0.1:8317/v1/chat/completions
    api_key_env: CLIPROXY_API_KEY
    request_timeout_seconds: 900
    models:
      - id: gemini-3.8-flash-high
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
  # 硅基流动：免费嵌入与语音转写。url 配上游源站，embeddings / audio
  # transcriptions 端点由网关透传时在其后拼接路径；这些模型都不注册 chat
  # 能力，不会被聊天路由选中。
  - name: siliconflow
    type: openai
    url: https://api.siliconflow.cn
    api_key_env: SILICONFLOW_API_KEY
    models:
      # 免费嵌入：kbvector / RAG 向量化用这个
      - id: BAAI/bge-m3
        capabilities: [embedding]
        description: "免费嵌入模型（1024 维），知识库向量化用"
      # 轻量语音转写（SenseVoice）：短语音、快速出稿场景（沿用本机运行时已有条目）
      - id: FunAudioLLM/SenseVoiceSmall
        capabilities: [audio_transcription, text]
      # 日常主力：准确流畅，常规录音转写
      - id: XingChenAGI/XingChenASR-V3.2
        capabilities: [audio_transcription]
        description: "日常主力，准确流畅；常规单人说活录音用它"
      # 高精度档：专有名词、中英混排的大小写渲染最准，适合定稿
      - id: XingChenAGI/XingChenASR-V3.2-Ultra
        capabilities: [audio_transcription]
        description: "高精度定稿档；专有名词与中英混排大小写最准，耗时内容首选"
      # 会议档：返回 segments 说话人分段+时间戳（谁在何时说了什么）
      - id: XingChenAGI/XingChenASR-Diarize-V3.0
        capabilities: [audio_transcription]
        description: "多人会议档；响应含 segments 说话人分段与时间戳"
  # 硅基流动 chat：DeepSeek V4.1 Flash 走硅基流动 keyed 渠道，是 coding 链里
  # deepseek 档的稳定供给。openai 类型 provider 的 url 就是 chat POST 端点，
  # 与上面 siliconflow（embeddings/转写透传用裸源站）分开注册，互不影响。
  # 2026-11-03 实测真实对话可用。
  - name: siliconflow-chat
    type: openai
    url: https://api.siliconflow.cn/v1/chat/completions
    api_key_env: SILICONFLOW_API_KEY
    models:
      - id: deepseek-ai/DeepSeek-V4.1-Flash
        capabilities: [text, tool_calling, streaming, reasoning]
        description: "DeepSeek V4.1 Flash（硅基流动 keyed），coding 链 deepseek 档"

  # 账号渠道（minimax/cline/lobster/gemini/codebuddy/workbuddy/trae/loomy/
  # raccoon/opencode）暂未使用（本机无登录凭据），provider 条目已移除以精简
  # 模型目录。渠道登录实现仍在网关内（Admin API /admin/channels 可用），
  # 需要时把对应 type: channel 的 provider 条目加回来，历史写法见 Git 历史。

  # Kilo AI 公共网关免费池：无需 Key（allow_no_key）。上游会记录 prompt 并用于改进服务，
  # 请勿经此 Provider 发送敏感内容；模型清单与额度由上游决定。
  # 清单只保留经真实请求验证的模型；失效条目由 scripts/sync-free-channels.sh
  # 每日比对上游免费清单后修剪，新增不自动跟进（避免无关模型回流）。
  # Jev 结构化判断走 systemone 端点，见下方 opencode-systemone-free。
  - name: kilo
    type: openai
    url: https://api.kilo.ai/api/gateway/chat/completions
    api_key_env: KILO_API_KEY
    allow_no_key: true
    models:
      # 自动路由档：上游在免费池内自选可用模型（2026-11-03 实测匿名可用）
      - id: kilo-auto/free
        capabilities: [text, tool_calling, streaming]
      # 大参数免费档（550B MoE，2026-11-03 实测匿名可用）
      - id: nvidia/nemotron-3-ultra-550b-a55b:free
        capabilities: [text, tool_calling, streaming]
  # Jev uses System One state/questions and JSON answers, not chat/completions.
  # https://opencode.ai/v2/docs/console/models/#jev
  - name: opencode-systemone-free
    type: systemone
    url: https://opencode.ai/inference/systemone/v1/systemone
    api_key_env: OPENCODE_API_KEY
    allow_no_key: true
    models:
      - id: jev-1.13-free
        protocol: systemone
        capabilities: [systemone]
        input_modalities: [text]
        description: "结构化判断：noul / choice / score。免费额度由上游控制；POST /v1/systemone。"

chains:
  # 唯一对外入口。按能力从强到弱排列，任一档失败（含限流、无权限、
  # 上游 5xx）都自动降级到下一档，客户端始终只调用这个名字。
  # deepseek 与 glm-5.3-flash 的稳定供给分层：deepseek-flash / deepv-glm-5.3-flash
  # 是代码注册的 DeepV 集成实例（不在 providers.yaml，2026-11-03 实测可用）；
  # deepseek-ai/DeepSeek-V4.1-Flash 走硅基流动 keyed，是 DeepV 不可用时的稳定兜底；
  # glm-5.3(-flash) 走智谱 keyed；kilo-auto/free 是匿名免费兜底。
  coding:
    - glm-5.3
    - glm-5.3-flash
    - deepseek-flash
    - deepseek-ai/DeepSeek-V4.1-Flash
    - deepv-glm-5.3-flash
    - gemini-3.8-flash-high
    - kilo-auto/free
