# 模型提供商配置
# 命名规则：
#   - provider 实例名与对外模型名都用上游模型 ID，不设置别名
#   - 不同供应商提供同名模型时（如智谱与 DeepV 都有 glm-5.3-flash），
#     后注册的那个用 供应商-模型 限定，保证实例名唯一
#   - 客户端只调用 chains 里定义的链，链内按顺序持续降级

# 留空保留所有网页来源均可跨域访问；配置后仅放行这些 HTTP(S) origin。
cors:
  allowed_origins: []

providers:
  # 智谱 GLM
  - name: glm
    type: openai
    url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api_key_env: GLM_API_KEY
    # GLM-5.3 reasoning 请求可能超过常规 120 秒上游期限，显式放宽，
    # 避免长请求仍在处理时被本地超时中断并计入熔断。
    request_timeout_seconds: 900
    # 始终思考模型：大上下文 + 工具结果时首 token 前的思考可能超过全局思考档
    # 默认，per-provider 覆盖思考档首字期限（fallback 预算随之抬升）。
    reasoning_first_output_timeout_seconds: 180
    models:
      - id: glm-5.3
        # 始终思考模型：上游不接受 thinking:disabled（网关侧自动丢弃该参数）
        capabilities: [text, tool_calling, streaming, reasoning]
      # flash 同样支持图片输入（实测 coding/paas 两个端点都收 image_url），
      # 因此图片能力落在这一档，不再单开一个更弱的 glm-5v-turbo 供应商。
      - id: glm-5.3-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]

  # ChatGPT Plus/Pro Codex subscription. The provider reads OAuth credentials
  # from Codex CLI/Pi auth.json; HTTP_PROXY is optional and only controls
  # network access.
  - name: chatgpt
    type: chatgpt
    url: https://chatgpt.com/backend-api
    models:
      # GPT-6 家族（账号当前主线）。gpt-6-terra 不存在、gpt-6-pro 与各 -wm
      # 变体在 Codex 订阅端点会被拒（HTTP 400 "not supported"），故不登记。
      - id: gpt-6.1-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-6-astra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      # GPT-5.6 家族：上游仍在服务，且部分客户端配置仍引用这些名字。
      - id: gpt-5.6-sol
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-luna
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000
      - id: gpt-5.6-terra
        protocol: responses
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 128000

  # Antigravity（Google 账号 OAuth，由本机 8317 端口的 CLIProxyAPI 反代）。
  # 凭据/token 续期都在 CLIProxyAPI 侧维护，网关只当普通 OpenAI 兼容上游用；
  # CLIPROXY_API_KEY 是 CLIProxyAPI config.yaml 里的静态 api-key。
  # gemini-3.8-flash 是当前 Gemini 系列主力（-high 为思考档后缀，属上游真名），
  # 实测接受 image_url（vision 落在这一档）。
  - name: antigravity
    type: openai
    url: http://127.0.0.1:8317/v1/chat/completions
    api_key_env: CLIPROXY_API_KEY
    request_timeout_seconds: 900
    models:
      - id: gemini-3.8-flash-high
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
  # 硅基流动：免费嵌入与语音转写。url 配上游源站，embeddings / audio
  # transcriptions 端点由网关透传时在其后拼接路径；这些模型都不注册 chat
  # 能力，不会被聊天路由选中。
  - name: siliconflow
    type: openai
    url: https://api.siliconflow.cn
    api_key_env: SILICONFLOW_API_KEY
    models:
      # 免费嵌入：kbvector / RAG 向量化用这个
      - id: BAAI/bge-m3
        capabilities: [embedding]
        description: "免费嵌入模型（1024 维），知识库向量化用"
      # 日常主力：准确流畅，常规录音转写
      - id: XingChenAGI/XingChenASR-V3.2
        capabilities: [audio_transcription]
        description: "日常主力，准确流畅；常规单人说活录音用它"
      # 高精度档：专有名词、中英混排的大小写渲染最准，适合定稿
      - id: XingChenAGI/XingChenASR-V3.2-Ultra
        capabilities: [audio_transcription]
        description: "高精度定稿档；专有名词与中英混排大小写最准，耗时内容首选"
      # 会议档：返回 segments 说话人分段+时间戳（谁在何时说了什么）
      - id: XingChenAGI/XingChenASR-Diarize-V3.0
        capabilities: [audio_transcription]
        description: "多人会议档；响应含 segments 说话人分段与时间戳"
  # ── 账号渠道（第二类）─────────────────────────────────────────────────────
  # 凭据不是 api_key，而是复刻官方客户端登录拿到的 OAuth 令牌：登录由网关内置的
  # 设备码流程完成（管理面板 POST /admin/channels/<渠道>/login），凭据只落本机
  # <LLM_GATEWAY_HOME>/channels/ 下的 0600 文件。这里的 models 只声明「这个渠道
  # 对外提供哪些模型」，不提供密钥。
  #
  # ⚠️ 这些上游是各家产品的私有端点，用官方客户端凭据直接调用属于非官方用法，
  # 可能违反其服务条款并导致账号被封。仅用于本机个人测试，不要对外分发。
  - name: minimax
    type: channel
    channel: minimax
    # 上游是 Anthropic Messages 协议，网关复用 AnthropicProvider 的传输与 SSE 透传。
    models:
      # M3.1 强制思考：上游对 thinking:disabled 直接 400，网关已在请求体里
      # 统一改写为 adaptive（见 channel.MiniMaxTransformRequest）。
      - id: MiniMax-M3.1-Flash-Preview
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
      - id: MiniMax-M3
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
      - id: MiniMax-M2.7
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: MiniMax-M2.7-highspeed
        capabilities: [text, tool_calling, streaming, reasoning]
  - name: cline
    type: channel
    channel: cline
    # 上游是 OpenAI Chat Completions 协议；令牌需带 workos: 前缀，网关在渠道层
    # 已处理。以下为当前免费的三个模型。
    models:
      - id: stealth/space-bunny-alpha
        capabilities: [text, vision, tool_calling, streaming]
        input_modalities: [text, image]
      - id: cline-free/mimo-v2.6-flash
        capabilities: [text, vision, tool_calling, streaming]
        input_modalities: [text, image]
      - id: cline-free/muse-spark-1.3-contributor
        capabilities: [text, vision, tool_calling, streaming]
        input_modalities: [text, image]
  # LobsterAI（有道）：登录是授权码 + 本机回环回调（管理面板发起后返回 login_url，
  # 在浏览器打开完成授权，网关本地端口接收 ?code=）。推理走 OpenAI Chat Completions
  # 协议（/api/proxy/v1/chat/completions），故复用 OpenAIProvider。
  - name: lobster
    type: channel
    channel: lobster
    # 模型清单来自客户端自带的 fallback 目录（LOBSTERAI_FALLBACK_MODELS）。
    # 上游按套餐提供其中一部分，网关按这份清单注册；某个模型对账号无权限时会被
    # 上游拒绝，链上自动降级到下一档。
    models:
      - id: kimi-k2.7-code
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: kimi-k2.7-code-highspeed
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: kimi-k2.6
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: kimi-k2.5
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
      - id: deepseek-v4-flash
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: deepseek-v4-pro
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: qwen3.7-max
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: qwen3.7-plus
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-5.2
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: glm-5.1
        capabilities: [text, tool_calling, streaming, reasoning]
      - id: doubao-seed-2-1-pro-260628
        capabilities: [text, tool_calling, streaming, reasoning]
  # Gemini Code Assist（CloudCode / Antigravity）：登录是 Google OAuth 授权码 +
  # 本机 localhost 回环回调。推理端点是 CloudCode 私有协议
  # （v1internal:streamGenerateContent），既不是 OpenAI 也不是 Anthropic，由
  # provider.CloudCodeProvider 做信封与 SSE 翻译。
  #
  # OAuth 客户端凭据不进仓库：需先注册 Google OAuth 桌面应用客户端（回调地址
  # http://localhost:<port>/oauth-callback），再把 client_id/client_secret 通过
  # 环境变量 GEMINI_CHANNEL_CLIENT_ID/GEMINI_CHANNEL_CLIENT_SECRET 或
  # <LLM_GATEWAY_HOME>/gemini-client.json 提供，否则发起登录会直接报错。
  #
  # 模型名统一带 `cloudcode/` 前缀：现有 CLIProxyAPI 的 antigravity 供应商已占用
  # 裸名 `gemini-3.8-flash-high`，网关里同名模型会互相覆盖注册，加前缀后才能两路
  # 并存。前缀属网关侧命名，发往上游前会被 provider 剥掉。
  #
  # 模型名末尾的思考档（-low/-medium/-high/-tiered）决定 thinkingBudget
  # （low=1000 / medium=4000 / high=10000 / tiered=自适应），发往上游的名字就是
  # gemini-3.8-flash-<档>（与 antigravity 供应商的档位命名一致，属上游真名）。
  # 不带后缀时默认 medium，即上游收到 gemini-3.8-flash-medium。
  - name: gemini
    type: channel
    channel: gemini
    models:
      - id: cloudcode/gemini-3.8-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        description: "Gemini 3.8 Flash（CloudCode 渠道），思考档默认 medium"
      - id: cloudcode/gemini-3.8-flash-low
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        description: "Gemini 3.8 Flash（CloudCode 渠道），低思考档（更快）"
      - id: cloudcode/gemini-3.8-flash-medium
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
      - id: cloudcode/gemini-3.8-flash-high
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        description: "Gemini 3.8 Flash（CloudCode 渠道），高思考档；与 antigravity 的裸名档位靠前缀区分"
      - id: cloudcode/gemini-3.8-flash-tiered
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        description: "Gemini 3.8 Flash（CloudCode 渠道），自适应思考档（上游自行决定预算）"

  # CodeBuddy（腾讯）/ WorkBuddy（国际版）：两者共用同一套私有登录与推理协议，
  # 网关里是同一个渠道实现（channel.BuddyChannel）加两张产品常量表。登录形态是
  # 「申请 state + 轮询」，既不是设备码也没有回环回调：网关先向
  # /v2/plugin/auth/state 取 state 与登录地址，交给用户在浏览器打开，随后用同一个
  # state 轮询 /v2/plugin/auth/token 拿令牌（未就绪回 code=11217）、再轮询
  # /v2/plugin/login/account 补账号信息（未就绪回 code=12151）——这两个码属正常
  # 等待，不是失败。推理走 OpenAI Chat Completions 协议（/v2/chat/completions），
  # 故复用 OpenAIProvider，渠道层只负责令牌、复刻头与续期。
  #
  # 两个渠道的模型名都带自己的前缀（codebuddy/、workbuddy/）：这两家的模型清单与
  # 既有供应商大量重名（glm-5.3、glm-5.2、kimi-k2.6、deepseek-v4-flash…），网关按
  # 模型 ID 注册路由，裸名会覆盖既有 provider。前缀属网关侧命名，发往上游前由
  # channel.BuddyChannel.TransformRequest 剥掉。
  #
  # WorkBuddy 的 User-Agent 按模型家族切换：GPT/Gemini/Claude 系用国际版形态，
  # glm/hy/kimi/minimax 系用国内客户端形态，网关在渠道层按模型名解析。
  # 下面的 max_input_tokens/max_output_tokens 取自官方客户端自带的模型元数据。
  - name: codebuddy
    type: channel
    channel: codebuddy
    # 模型清单来自客户端自带目录（CODEBUDDY_FALLBACK_MODELS）。
    models:
      - id: codebuddy/hy4-preview
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: codebuddy/hy3
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 192000
        max_output_tokens: 64000
      - id: codebuddy/hy3-x
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 192000
        max_output_tokens: 64000
      - id: codebuddy/deepseek-v4.1-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 128000
      - id: codebuddy/deepseek-v4-pro
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 128000
      - id: codebuddy/deepseek-v4-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 50000
      - id: codebuddy/glm-5.3
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: codebuddy/glm-5.3-flash
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 32000
      - id: codebuddy/glm-5.2
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: codebuddy/glm-5.1
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 200000
        max_output_tokens: 48000
      - id: codebuddy/glm-5v-turbo
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 200000
        max_output_tokens: 64000
      - id: codebuddy/kimi-k3-1
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 32000
      - id: codebuddy/kimi-k2.8-preview
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: codebuddy/kimi-k2.7
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 256000
        max_output_tokens: 32000
      - id: codebuddy/kimi-k2.6
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 256000
        max_output_tokens: 32000
      - id: codebuddy/minimax-m3
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 512000
        max_output_tokens: 64000
  - name: workbuddy
    type: channel
    channel: workbuddy
    # 模型清单来自客户端自带目录。前五项是服务端档位别名（default-model 等），
    # 由上游映射到具体模型，保留以复刻官方清单。
    models:
      - id: workbuddy/default-model
        capabilities: [text, vision, tool_calling, streaming]
        input_modalities: [text, image]
        max_input_tokens: 176000
        max_output_tokens: 24000
        description: "WorkBuddy 服务端默认档别名，由上游映射到具体模型"
      - id: workbuddy/fast-model
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 200000
        max_output_tokens: 32000
        description: "WorkBuddy 快速档别名，由上游映射到具体模型"
      - id: workbuddy/balanced-model
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 256000
        max_output_tokens: 32000
        description: "WorkBuddy 均衡档别名，由上游映射到具体模型"
      - id: workbuddy/primary-model
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 272000
        max_output_tokens: 72000
        description: "WorkBuddy 主力档别名，由上游映射到具体模型"
      - id: workbuddy/deep-model
        capabilities: [text, vision, tool_calling, streaming]
        input_modalities: [text, image]
        max_input_tokens: 176000
        max_output_tokens: 24000
        description: "WorkBuddy 深度档别名，由上游映射到具体模型"
      - id: workbuddy/hy4-preview-f
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: workbuddy/hy4-preview
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 1000000
        max_output_tokens: 64000
      - id: workbuddy/hy3
        capabilities: [text, vision, tool_calling, streaming, reasoning]
        input_modalities: [text, image]
        max_input_tokens: 192000
