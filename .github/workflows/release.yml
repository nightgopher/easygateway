name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer-tests:
    name: Installer Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: /bin/bash scripts/tests/install-unix.Tests.sh

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File scripts\tests\install-windows.Tests.ps1

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: installer-tests
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        working-directory: go-gateway
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SUFFIX="${{ matrix.suffix }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "gateway-${SUFFIX}.exe" .
            ls -lh "gateway-${SUFFIX}.exe"
          else
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "gateway-${SUFFIX}" .
            ls -lh "gateway-${SUFFIX}"
          fi

      - name: Build deb package (Linux)
        if: matrix.goos == 'linux'
        env:
          GATEWAY_BIN: ${{ github.workspace }}/go-gateway/gateway-${{ matrix.suffix }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c 'import json; print(json.load(open("desktop/mygo.json"))["version"])')
          fi
          scripts/build-deb.sh "$VERSION" "${{ matrix.goarch }}" "dist"
          ls -lh dist/*.deb

      - name: Upload artifact (Unix)
        if: matrix.goos != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.suffix }}
          path: go-gateway/gateway-${{ matrix.suffix }}

      - name: Upload deb artifact (Linux)
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: easygateway-deb-${{ matrix.suffix }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.suffix }}
          path: go-gateway/gateway-${{ matrix.suffix }}.exe

  desktop-release:
    name: Build macOS desktop release
    runs-on: macos-14
    needs: installer-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Validate desktop version
        working-directory: desktop
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag does not match desktop version $VERSION" >&2
            exit 1
          fi
      - run: go test -race ./... && go vet ./...
        working-directory: desktop
      - run: go run github.com/egoist/mygo/cmd/mygo vet
        working-directory: desktop
      - name: Build desktop installer
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go run github.com/egoist/mygo/cmd/mygo build -platform darwin/arm64
          VERSION=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          mkdir -p ../desktop-release
          cp "build.noindex/darwin-arm64/EasyGateway $VERSION arm64.dmg" "../desktop-release/EasyGateway-$VERSION-darwin-arm64.dmg"
      - name: Notarize the macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="../desktop-release/EasyGateway-$VERSION-darwin-arm64.dmg"
          xcrun notarytool store-credentials "easygateway-notary" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "$DMG" --keychain-profile "easygateway-notary" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # 签名更新包（应用内自更新）：有密钥才产出，缺失时跳过并提示。
          find build.noindex/darwin-arm64 -maxdepth 2 \( -name 'update-*.json' -o -name 'EasyGateway-*.tar.gz' \) -exec cp {} ../desktop-release/ \; || true
          ls ../desktop-release/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-arm64
          path: desktop-release/*.dmg
          if-no-files-found: error

  desktop-release-linux:
    name: Build Linux desktop release
    runs-on: ubuntu-latest
    needs: installer-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Validate desktop version
        working-directory: desktop
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag does not match desktop version $VERSION" >&2
            exit 1
          fi
      - run: go test -race ./... && go vet ./...
        working-directory: desktop
      - run: go run github.com/egoist/mygo/cmd/mygo vet
        working-directory: desktop
      - name: Build desktop packages (Linux amd64 + arm64)
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go run github.com/egoist/mygo/cmd/mygo build -platform linux/amd64,linux/arm64
          VERSION=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          mkdir -p ../desktop-release
          for arch in amd64 arm64; do
            dpkg-deb --info "build.noindex/linux-$arch/easygateway_${VERSION}_${arch}.deb" > /dev/null
            dpkg-deb -c "build.noindex/linux-$arch/easygateway_${VERSION}_${arch}.deb" | grep -q "opt/easygateway/easygateway$"
            cp "build.noindex/linux-$arch/easygateway_${VERSION}_${arch}.deb" "../desktop-release/"
            cp "build.noindex/linux-$arch/easygateway-${VERSION}-linux-$arch.tar.gz" "../desktop-release/"
            cp "build.noindex/linux-$arch/install.sh" "../desktop-release/easygateway-desktop-install-linux-$arch.sh"
          done
          # 签名更新包（应用内自更新）
          find build.noindex -maxdepth 3 -name 'update-*.json' -exec cp {} ../desktop-release/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop-release/*
          if-no-files-found: error

  publish:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - installer-tests
      - release
      - desktop-release
      - desktop-release-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Prepare release files
        run: |
          mkdir -p release
          # 复制二进制
          cp artifacts/gateway-linux-amd64/gateway-linux-amd64 release/
          cp artifacts/gateway-linux-arm64/gateway-linux-arm64 release/
          cp artifacts/gateway-darwin-amd64/gateway-darwin-amd64 release/
          cp artifacts/gateway-darwin-arm64/gateway-darwin-arm64 release/
          cp artifacts/gateway-windows-amd64/gateway-windows-amd64.exe release/
          # 复制 deb 包
          cp artifacts/easygateway-deb-linux-amd64/*.deb release/
          cp artifacts/easygateway-deb-linux-arm64/*.deb release/
          # 复制桌面 Linux 包（deb / 用户级 tar.gz / install 脚本）
          cp artifacts/desktop-linux/easygateway_*_amd64.deb release/
          cp artifacts/desktop-linux/easygateway_*_arm64.deb release/
          cp artifacts/desktop-linux/easygateway-*-linux-*.tar.gz release/
          cp artifacts/desktop-linux/easygateway-desktop-install-linux-*.sh release/
          # 复制配置文件
          cp go-gateway/providers.yaml release/
          cp go-gateway/.env.example release/default.env.example
          # 复制安装脚本
          cp scripts/install.sh release/
          cp scripts/install.bat release/
          cp scripts/install.ps1 release/
          cp artifacts/desktop-darwin-arm64/*.dmg release/
          # 桌面端签名更新产物（存在才复制）
          cp artifacts/desktop-darwin-arm64/update-*.json release/ 2>/dev/null || true
          cp artifacts/desktop-linux/update-*.json release/ 2>/dev/null || true
          (cd release && sha256sum gateway-* *.deb *.tar.gz *.dmg providers.yaml default.env.example install.* easygateway-desktop-install-*.sh update-*.json > SHA256SUMS)
          # 列出文件
          ls -lh release/

      # 自更新签名清单：把各平台 gateway 二进制打成 tar.gz 并用 Ed25519
      # 私钥签名（公钥编译期内置于 internal/selfupdate）。未配置私钥时
      # （如手动 workflow_dispatch 演练）跳过，Release 不带更新清单，
      # 已安装实例继续用旧版本，不出错。
      - name: Sign gateway update manifests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "skip: no signing key configured"
            exit 0
          fi
          cd go-gateway && go run ./tools/updatesign -version "${GITHUB_REF_NAME#v}" -dir ../release
          (cd ../release && sha256sum gateway-*.tar.gz update-gateway-*.json >> SHA256SUMS)

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          # 生成 changelog
          CHANGELOG=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- 初始版本")

          cat > release_notes.md << EOF
          ## EasyGateway ${CURRENT_TAG}

          ### 安装

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/nightgopher/easygateway/main/scripts/install.sh | bash
          \`\`\`

          \`\`\`cmd
          curl.exe -fsSL -o "%TEMP%\llm-gateway-install.bat" https://raw.githubusercontent.com/nightgopher/easygateway/main/scripts/install.bat && call "%TEMP%\llm-gateway-install.bat"
          \`\`\`

          \`\`\`powershell
          \$installer = Join-Path \$env:TEMP 'llm-gateway-install.ps1'; Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/nightgopher/easygateway/main/scripts/install.ps1 -OutFile \$installer; powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File \$installer
          \`\`\`

          ### 更新日志
          ${CHANGELOG}

          ### 下载
          macOS 桌面包使用 ad-hoc 签名，尚未完成 Apple 公证。安装说明见 [桌面文档](https://github.com/nightgopher/easygateway/blob/${CURRENT_TAG}/desktop/README.md)。

          | 平台 | 文件 |
          |------|------|
          | macOS Apple Silicon 桌面 | \`EasyGateway-${CURRENT_TAG#v}-darwin-arm64.dmg\` |
          | Linux x86_64 桌面 (.deb) | \`easygateway_${CURRENT_TAG#v}_amd64.deb\` |
          | Linux ARM64 桌面 (.deb) | \`easygateway_${CURRENT_TAG#v}_arm64.deb\` |
          | Linux x86_64 桌面 (用户级安装) | \`easygateway-desktop-install-linux-amd64.sh\` |
          | Linux ARM64 桌面 (用户级安装) | \`easygateway-desktop-install-linux-arm64.sh\` |
          | Linux x86_64 服务端 (.deb) | \`easygateway-server_${CURRENT_TAG#v}-1_amd64.deb\` |
          | Linux ARM64 服务端 (.deb) | \`easygateway-server_${CURRENT_TAG#v}-1_arm64.deb\` |
          | Linux x86_64 | \`gateway-linux-amd64\` |
          | Linux ARM64 | \`gateway-linux-arm64\` |
          | macOS Intel | \`gateway-darwin-amd64\` |
          | macOS Apple Silicon | \`gateway-darwin-arm64\` |
          | Windows x86_64 | \`gateway-windows-amd64.exe\` |

          桌面端与服务端是两个独立的 deb 包（\`easygateway\` 与 \`easygateway-server\`），可同时安装：桌面端管理网关，服务端提供 systemd 托管的网关进程。Linux 桌面端运行需要 libgtk-3 与 libwebkit2gtk-4.1（包依赖已声明）；用户级安装运行 \`easygateway-desktop-install-linux-*.sh\`，装到 \`~/.easygateway\` 并支持应用内更新。

          ### 快速使用
          \`\`\`bash
          # Debian/Ubuntu：安装 deb 包（含 systemd 服务，自动生成 Master Key）
          sudo dpkg -i easygateway-server_*.deb
          sudo apt-get install -f   # 修复依赖（如有）
          systemctl status easygateway

          # 或下载对应平台的二进制
          chmod +x gateway-*

          # 创建配置
          cp default.env.example .env
          nano .env  # 填入 API Key

          # 启动
          ./gateway-*
          \`\`\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "EasyGateway ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            release/gateway-linux-amd64
            release/gateway-linux-arm64
            release/gateway-darwin-amd64
            release/gateway-darwin-arm64
            release/gateway-windows-amd64.exe
            release/*.deb
            release/*.tar.gz
            release/easygateway-desktop-install-linux-*.sh
            release/providers.yaml
            release/default.env.example
            release/install.sh
            release/install.bat
            release/install.ps1
            release/*.dmg
            release/gateway-*.tar.gz
            release/update-gateway-*.json
            release/update-darwin-*.json
            release/update-linux-*.json
            release/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
