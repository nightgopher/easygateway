name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        working-directory: go-gateway
        run: |
          go vet ./...
          go test -v ./...
          go test ../scripts/verify-desktop-update.go ../scripts/verify-desktop-update_test.go
          bash ../scripts/tests/install-unix.Tests.sh

      - name: Test mini-host updater request configuration
        run: bash scripts/tests/gateway-auto-update.Tests.sh

  installer-test:
    name: Test Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer regression tests
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File scripts\tests\install-windows.Tests.ps1

  build-linux-gateway:
    name: Build Linux mini-host artifact
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - test
      - installer-test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux x86_64 gateway
        working-directory: go-gateway
        run: |
          mkdir -p ../dist
          go build -trimpath -buildvcs=false -ldflags "-X main.version=$GITHUB_SHA" -o ../dist/gateway-linux-amd64 .

      - name: Publish verified artifact for the mini host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-linux-amd64
          path: dist/gateway-linux-amd64
          if-no-files-found: error
          retention-days: 90
